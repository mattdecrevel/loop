name: Release client 🚀

# One-click release for @mattdecrevel/loop (packages/client).
#
# How to fire:
#   - GitHub Actions UI → "Release client 🚀" → Run workflow → pick patch/minor/major
#   - or: `gh workflow run publish-client.yml -f bump=patch`
#
# What it does:
#   1. bumps packages/client/package.json (npm version <bump>)
#   2. commits the bump straight to main
#   3. tags `client-vX.Y.Z` and pushes the tag
#   4. publishes to public npm with provenance
#   5. creates a GitHub Release with auto-generated notes
#
# Tag-push fallback: pushing a `client-v*` tag manually still publishes + releases
# (skips the bump+commit step). Useful for re-releasing a fix without bumping.
#
# Requires the NPM_TOKEN repo secret — an npm Automation token with publish
# access to the @mattdecrevel scope. Public repo + id-token:write enable
# --provenance.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write   # commit bump, push tag, gh release create
  id-token: write   # npm --provenance OIDC

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + a token that can push commits/tags back to main.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # --- Dispatch path: bump → commit → tag → push ----------------------
      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version + tag
        if: github.event_name == 'workflow_dispatch'
        id: bump
        working-directory: packages/client
        run: |
          # `npm version` bumps package.json (no git tag — we tag with the prefixed name ourselves).
          NEW_VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version | tr -d 'v')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=client-v${NEW_VERSION}"  >> "$GITHUB_OUTPUT"

      - name: Commit + push bump + tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add packages/client/package.json
          git commit -m "chore: release @mattdecrevel/loop@${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      # --- Common path: publish + release --------------------------------
      - name: Publish to npm (public, with provenance)
        working-directory: packages/client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Tag-push path: GITHUB_REF is refs/tags/client-vX.Y.Z
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${TAG#client-}"   # client-v0.3.2 → v0.3.2
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --latest
