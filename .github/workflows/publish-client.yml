name: Publish client

# Publishes @mattdecrevel/loop (packages/client) to PUBLIC npm and creates a
# GitHub Release with auto-generated notes.
#
# Trigger by pushing a tag like `client-v0.3.1` (semver after the `v`), or run
# manually with workflow_dispatch (which publishes without creating a release).
#
# Requires the NPM_TOKEN repo secret — an npm Automation token from
# https://www.npmjs.com/settings/<your-user>/tokens (type: Automation, with
# "Publish" permission for the @mattdecrevel scope).
#
# `--provenance` (via publishConfig) signs the publish with the GitHub Actions
# workflow identity so consumers can verify the package was built from this
# repo. Requires the `id-token: write` permission below and a public repo.

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write   # gh release create
  id-token: write   # npm --provenance OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (public, with provenance)
        working-directory: packages/client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (tag-driven runs only)
        if: startsWith(github.ref, 'refs/tags/client-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip the `client-v` prefix for the title (e.g. client-v0.3.1 → v0.3.1)
          TITLE="${TAG#client-}"
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --latest
