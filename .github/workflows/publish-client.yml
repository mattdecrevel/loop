name: Publish client

# Publishes @mattdecrevel/loop (packages/client) to npm.
# Run manually (workflow_dispatch) or by pushing a tag like `client-v0.2.0`.
# Requires NPM_TOKEN secret — create an Automation token at npmjs.com and add
# it to the repo's Actions secrets as NPM_TOKEN.

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build client
        working-directory: packages/client
        run: pnpm run build
      - name: Publish to npm
        working-directory: packages/client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
